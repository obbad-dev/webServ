# comment before server
server {
    listen   127.0.0.1:8082   ;
    root   /var/www/site   ;
    index   index.html   welcome.html   ;
    client_max_body_size   3k   ;
    error_page   404   403   500   /errors/custom.html   ;
    location   /api   {
        autoindex   on   ;
        root /api-root;
    }
}
