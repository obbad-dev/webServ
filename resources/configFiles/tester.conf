server
{ 
    listen 8080;
    root ./resources/sites/;                                                       
    index index.html;
	 client_max_body_size 100M;

	location /
    {
		allow_methods GET; 
		index index.html;
	}

	location /directory
    {
        root ./YoupiBanane;
        allow_methods GET POST;

        index youpi.bad_extension;
        cgi_pass .bla ./cgi_tester;

        client_max_body_size 100M;

        enable_upload on;
        upload_path ./YoupiBanane;
    }

    location /post_body
    {
        allow_methods POST;
        client_max_body_size 100;
    }
}
