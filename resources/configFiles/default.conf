server
{
    listen 8080;
    root ./resources/sites/;
	# error_page 404 errors/404.html;
	error_page 404 errors/404.jpg;

    location /
    {
        autoindex on;
        enable_upload on;
        upload_path ./resources/sites/cgi/uploads/;
        root ./resources/sites/;
        index __disable_index__.html;
    }

    location /here
    {
        allow_methods GET POST DELETE;
        index upload.html index.html;
	    root ./resources/sites/;
        autoindex on;
        enable_upload on;
        upload_path ./resources/sites/cgi/uploads;
    }

    location /cgi
    {
        allow_methods GET POST DELETE;
        autoindex on; 
        root ./resources/sites/cgi/;
        cgi_pass .py /usr/bin/python3;
    }

    location /cgi/uploads
    {
        allow_methods GET POST DELETE;
		root ./resources/sites/cgi/uploads/;
        enable_upload on;
        upload_path ./resources/sites/cgi/uploads/;
    }

    location /redirect
    {
        return 302 https://youtu.be/YQ0S5e5SGz4?si=0U0ZFqumIXtx9ye0;
    }
}

# CONFIGURATION FOR TESTER
server
{ 
    listen 7070;
    root ./resources/sites/;                                                       
    index index.html;
	client_max_body_size 100M;

	location /
    {
		allow_methods GET; 
		index index.html;
	}

	location /directory
    {
        root ./YoupiBanane;
        allow_methods GET POST;

        index youpi.bad_extension;
        cgi_pass .bla ./cgi_tester;

        client_max_body_size 100M;

        enable_upload on;
        upload_path ./YoupiBanane;
    }

    location /post_body
    {
        allow_methods POST;
        client_max_body_size 100;
    }
}
