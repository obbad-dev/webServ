<script>
const exercises = [
  // BEGINNER
  [
    {
      title:"Hello Alpine",
      desc:"Write your very first Dockerfile. It should be based on Alpine Linux and print a greeting when run.",
      tags:["FROM","CMD"],
      goal:"Build an image that prints \"Hello from Docker!\" using the exec form of CMD.",
      template:`FROM ___
CMD ["echo", "Hello from Docker!"]`,
      hint:"Use <code>alpine:3.19</code> as your base image. The exec form of CMD uses JSON array syntax — it doesn't invoke a shell, so it's the preferred form.",
      solution:`FROM alpine:3.19
CMD ["echo", "Hello from Docker!"]`,
      cmds:`docker build -t hello-docker .
docker run hello-docker`
    },
    {
      title:"Install a Package",
      desc:"Extend an Alpine image by installing a package and verifying it works.",
      tags:["RUN","apk add","layer"],
      goal:"Install curl and set CMD to run curl --version.",
      template:`FROM alpine:3.19
RUN ___
CMD ["curl", "--version"]`,
      hint:"Alpine uses <code>apk add --no-cache &lt;package&gt;</code>. The <code>--no-cache</code> flag avoids storing the index locally, keeping the image smaller.",
      solution:`FROM alpine:3.19
RUN apk add --no-cache curl
CMD ["curl", "--version"]`,
      cmds:`docker build -t curl-alpine .
docker run curl-alpine`
    },
    {
      title:"Copy Files",
      desc:"Copy a local file into the image and set a working directory for your app.",
      tags:["COPY","WORKDIR"],
      goal:"Create an index.html on your host, copy it into /app inside the image, and print it.",
      template:`FROM alpine:3.19
WORKDIR ___
COPY ___ ___
CMD ["cat", "index.html"]`,
      hint:"<code>WORKDIR /app</code> creates the directory and sets it as the current path. <code>COPY src dest</code> — using <code>.</code> as dest copies into WORKDIR.",
      solution:`FROM alpine:3.19
WORKDIR /app
COPY index.html .
CMD ["cat", "index.html"]`,
      cmds:`echo "<h1>Hello Docker</h1>" > index.html
docker build -t copy-demo .
docker run copy-demo`
    },
    {
      title:"Environment Variables",
      desc:"Use ENV to bake a variable into the image that is accessible at runtime.",
      tags:["ENV"],
      goal:"Set an env variable NAME=Docker and have CMD print \"Hello, Docker!\" using it.",
      template:`FROM alpine:3.19
ENV ___=___
CMD ["sh", "-c", "echo Hello, $NAME!"]`,
      hint:"<code>ENV KEY=VALUE</code> sets an environment variable that persists in all subsequent layers and at runtime. You can override it at run time with <code>-e NAME=other</code>.",
      solution:`FROM alpine:3.19
ENV NAME=Docker
CMD ["sh", "-c", "echo Hello, $NAME!"]`,
      cmds:`docker build -t env-demo .
docker run env-demo
docker run -e NAME=42 env-demo`
    },
    {
      title:"Expose a Port",
      desc:"Document which port your service listens on using EXPOSE.",
      tags:["EXPOSE"],
      goal:"Create an nginx image that EXPOSEs port 80, then run it and map it to port 8080 on your host.",
      template:`FROM nginx:1.25-alpine
EXPOSE ___
CMD ["nginx", "-g", "daemon off;"]`,
      hint:"<code>EXPOSE</code> is documentation — it does NOT publish the port. You publish with <code>-p host:container</code> at run time. nginx listens on 80 by default.",
      solution:`FROM nginx:1.25-alpine
EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]`,
      cmds:`docker build -t my-nginx .
docker run -p 8080:80 my-nginx
# Visit http://localhost:8080`
    },
    {
      title:"Non-Root User",
      desc:"Running as root inside a container is a security risk. Create and switch to a dedicated user.",
      tags:["USER","RUN adduser"],
      goal:"Create a user called appuser and run CMD as that user. Verify with whoami.",
      template:`FROM alpine:3.19
RUN adduser -D ___
USER ___
CMD ["whoami"]`,
      hint:"<code>adduser -D username</code> creates a user without a password. The <code>USER</code> instruction applies to all subsequent <code>RUN</code>, <code>CMD</code>, and <code>ENTRYPOINT</code> instructions.",
      solution:`FROM alpine:3.19
RUN adduser -D appuser
USER appuser
CMD ["whoami"]`,
      cmds:`docker build -t user-demo .
docker run user-demo
# Should print: appuser`
    }
  ],
  // INTERMEDIATE
  [
    {
      title:"ENTRYPOINT vs CMD",
      desc:"Understand how ENTRYPOINT and CMD work together — and why the distinction matters for flexible images.",
      tags:["ENTRYPOINT","CMD","exec form"],
      goal:"Set ENTRYPOINT to echo and CMD to a default message. Then run the container with a custom message to override CMD only.",
      template:`FROM alpine:3.19
ENTRYPOINT ["echo"]
CMD ["___"]`,
      hint:"When ENTRYPOINT is set, CMD provides <em>default arguments</em> to it. Running <code>docker run img custom msg</code> replaces CMD with <code>custom msg</code> but keeps ENTRYPOINT. To fully replace ENTRYPOINT: use <code>--entrypoint</code>.",
      solution:`FROM alpine:3.19
ENTRYPOINT ["echo"]
CMD ["Hello — this is the default message"]`,
      cmds:`docker build -t ep-demo .
docker run ep-demo
# → Hello — this is the default message
docker run ep-demo "Custom override"
# → Custom override`
    },
    {
      title:"Build Arguments (ARG)",
      desc:"ARG lets you pass variables at build time — they are NOT available at runtime. Useful for versioning and configuration during the build.",
      tags:["ARG","build-time","--build-arg"],
      goal:"Define an ARG for Alpine version (default 3.19) and use it in FROM. Build the same Dockerfile for two different versions.",
      template:`ARG ___=3.19
FROM alpine:${"\${"}___}
CMD ["cat", "/etc/alpine-release"]`,
      hint:"<code>ARG</code> must be declared <em>before</em> <code>FROM</code> to use it in the FROM line. After FROM, re-declare it (<code>ARG ALPINE_VERSION</code> with no default) if you need it again in RUN steps.",
      solution:`ARG ALPINE_VERSION=3.19
FROM alpine:\${ALPINE_VERSION}
CMD ["cat", "/etc/alpine-release"]`,
      cmds:`docker build -t alpine-default .
docker run alpine-default
# → 3.19.x

docker build --build-arg ALPINE_VERSION=3.18 -t alpine-old .
docker run alpine-old
# → 3.18.x`
    },
    {
      title:"Multi-Stage Build",
      desc:"Multi-stage builds let you compile code in one image and copy only the result into a minimal final image — keeping your production image lean.",
      tags:["multi-stage","AS","COPY --from"],
      goal:"Compile a small C program in a builder stage and copy only the binary into a clean Alpine image.",
      template:`FROM alpine:3.19 AS ___
RUN apk add --no-cache gcc musl-dev
WORKDIR /build
COPY hello.c .
RUN gcc -o hello hello.c

FROM alpine:3.19
COPY --from=___ /build/hello /usr/local/bin/
CMD ["hello"]`,
      hint:"Name your first stage with <code>AS builder</code>. <code>COPY --from=builder</code> pulls files from that stage. The final image contains only what you explicitly copy — no compiler, no source.",
      solution:`FROM alpine:3.19 AS builder
RUN apk add --no-cache gcc musl-dev
WORKDIR /build
COPY hello.c .
RUN gcc -o hello hello.c

FROM alpine:3.19
COPY --from=builder /build/hello /usr/local/bin/
CMD ["hello"]`,
      cmds:`# hello.c: #include<stdio.h>\nint main(){printf("Hello!\\n");}
docker build -t multi-stage .
docker run multi-stage
docker images multi-stage   # Much smaller than builder!`
    },
    {
      title:"Entrypoint Script",
      desc:"Real services need initialization before starting. An entrypoint script handles setup and then hands off to the main process correctly.",
      tags:["entrypoint.sh","exec","PID 1","signals"],
      goal:"Write a shell entrypoint script that prints an env variable then runs CMD using exec. Understand why exec is critical.",
      template:`FROM alpine:3.19
ENV GREETING="Hello"
COPY entrypoint.sh /entrypoint.sh
RUN chmod +x /entrypoint.sh
ENTRYPOINT ["/entrypoint.sh"]
CMD ["echo", "done"]`,
      hint:"<code>exec \"$@\"</code> is essential — it <em>replaces</em> the shell process with your CMD, making CMD become PID 1. Without exec, the shell stays as PID 1 and won't forward signals to your app. Always use exec at the end of entrypoint scripts.",
      solution:`# entrypoint.sh:
#!/bin/sh
echo "Greeting: $GREETING"
exec "$@"

# Dockerfile:
FROM alpine:3.19
ENV GREETING="Hello from Docker"
COPY entrypoint.sh /entrypoint.sh
RUN chmod +x /entrypoint.sh
ENTRYPOINT ["/entrypoint.sh"]
CMD ["echo", "CMD ran correctly"]`,
      cmds:`docker build -t ep-script .
docker run ep-script
# → Greeting: Hello from Docker
# → CMD ran correctly`
    },
    {
      title:"Layer Caching Optimization",
      desc:"Docker caches each layer. If a layer changes, all layers after it are rebuilt. Ordering your instructions correctly dramatically speeds up builds.",
      tags:["layer cache","ordering","RUN"],
      goal:"Fix the Dockerfile below so that dependency installation is cached independently from source code changes.",
      template:`# BAD — every code change reinstalls all deps:
FROM python:3.11-alpine
COPY . /app
WORKDIR /app
RUN pip install -r requirements.txt
CMD ["python", "app.py"]

# FIX IT:`,
      hint:"Copy only the dependency manifest first (<code>requirements.txt</code>), run the install, <em>then</em> copy the rest of the source. When you change app.py, Docker reuses the cached pip install layer.",
      solution:`# GOOD — pip install layer is cached:
FROM python:3.11-alpine
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
CMD ["python", "app.py"]`,
      cmds:`# Also create a .dockerignore:
# __pycache__/
# *.pyc
# .env
# .git`
    }
  ],
  // ADVANCED
  [
    {
      title:"The PID 1 Problem",
      desc:"PID 1 is special in Linux — it receives signals that other processes don't. Running your app incorrectly means SIGTERM is never received and containers won't stop cleanly.",
      tags:["PID 1","SIGTERM","exec form","tini"],
      goal:"Understand the difference between shell form and exec form, and why using a shell wrapper without exec breaks signal handling.",
      template:`# Shell form — WRONG for PID 1:
CMD nginx -g "daemon off;"
# Shell is PID 1, nginx is PID 2. SIGTERM hits the
# shell, which does NOT forward it to nginx by default.

# Exec form — CORRECT:
CMD ___

# Or with a wrapper script — only correct if:
ENTRYPOINT ["/entrypoint.sh"]
# entrypoint.sh must end with: exec "$@"`,
      hint:"The exec form (<code>[\"cmd\", \"arg\"]</code>) makes your process PID 1 directly. In entrypoint scripts, <code>exec \"$@\"</code> replaces the shell with CMD. For complex apps, consider <code>tini</code> as a minimal init: <code>RUN apk add tini</code> + <code>ENTRYPOINT [\"/sbin/tini\", \"--\"]</code>.",
      solution:`# Correct exec form:
FROM nginx:1.25-alpine
CMD ["nginx", "-g", "daemon off;"]

# With tini for robust signal handling:
FROM alpine:3.19
RUN apk add --no-cache nginx tini
ENTRYPOINT ["/sbin/tini", "--"]
CMD ["nginx", "-g", "daemon off;"]`,
      cmds:`# Test: does SIGTERM stop it cleanly?
docker run -d --name test my-nginx
docker stop test   # Should stop quickly
# If it takes 10s, SIGTERM isn't being handled`
    },
    {
      title:"HEALTHCHECK",
      desc:"Docker can monitor your container's health and restart it if it becomes unhealthy. This is essential for production services.",
      tags:["HEALTHCHECK","--interval","--retries","container health"],
      goal:"Add a HEALTHCHECK to an nginx container that verifies it responds to HTTP requests. Tune the interval and retry count.",
      template:`FROM nginx:1.25-alpine
RUN apk add --no-cache curl
EXPOSE 80
HEALTHCHECK --interval=___ --timeout=___ --retries=___ \\
  CMD curl -f http://localhost/ || exit 1
CMD ["nginx", "-g", "daemon off;"]`,
      hint:"<code>--interval</code>: time between checks. <code>--timeout</code>: max time for one check. <code>--retries</code>: consecutive failures before marking unhealthy. <code>--start-period</code>: grace period at startup. <code>exit 1</code> = unhealthy, <code>exit 0</code> = healthy.",
      solution:`FROM nginx:1.25-alpine
RUN apk add --no-cache curl
EXPOSE 80
HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \\
  CMD curl -f http://localhost/ || exit 1
CMD ["nginx", "-g", "daemon off;"]`,
      cmds:`docker build -t healthy-nginx .
docker run -d --name htest healthy-nginx
docker inspect --format='{{.State.Health.Status}}' htest
# → starting / healthy / unhealthy`
    },
    {
      title:"Inception — NGINX + TLS",
      desc:"Build the NGINX container required by the Inception project: TLSv1.2/1.3 only, self-signed certificate, no HTTP port, forwarding to php-fpm.",
      tags:["TLS","openssl","ssl_protocols","NGINX config","443"],
      goal:"Build NGINX from Debian, generate a self-signed cert, configure it to accept ONLY TLSv1.2 and TLSv1.3 on port 443, and proxy to a WordPress php-fpm backend.",
      template:`FROM debian:bullseye
RUN apt-get update && apt-get install -y nginx openssl \\
    && rm -rf /var/lib/apt/lists/*

RUN mkdir -p /etc/nginx/ssl && openssl req -x509 \\
    -newkey rsa:4096 -keyout /etc/nginx/ssl/key.pem \\
    -out /etc/nginx/ssl/cert.pem -days 365 -nodes \\
    -subj "/CN=___.42.fr"

COPY nginx.conf /etc/nginx/conf.d/default.conf
EXPOSE ___
CMD ["nginx", "-g", "daemon off;"]`,
      hint:"Your nginx.conf must include <code>ssl_protocols TLSv1.2 TLSv1.3;</code> — omit older protocols entirely. Use <code>fastcgi_pass wordpress:9000</code> to reach php-fpm. Replace login with your 42 username. No password in Dockerfile — use Docker secrets or env vars for real certs.",
      solution:`# Dockerfile:
FROM debian:bullseye
RUN apt-get update && apt-get install -y nginx openssl \\
    && rm -rf /var/lib/apt/lists/*
RUN mkdir -p /etc/nginx/ssl && openssl req -x509 \\
    -newkey rsa:4096 -keyout /etc/nginx/ssl/key.pem \\
    -out /etc/nginx/ssl/cert.pem -days 365 -nodes \\
    -subj "/C=FR/O=42/CN=login.42.fr"
COPY nginx.conf /etc/nginx/conf.d/default.conf
EXPOSE 443
CMD ["nginx", "-g", "daemon off;"]

# nginx.conf:
server {
  listen 443 ssl;
  ssl_certificate     /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  root /var/www/html;
  index index.php;
  location ~ \\.php$ {
    fastcgi_pass wordpress:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }
}`,
      cmds:`docker build -t nginx .
# Only port 443 — no 80 listener at all
curl -k https://localhost:443`
    },
    {
      title:"Inception — MariaDB Init",
      desc:"Build a MariaDB container from scratch — no official DB image allowed. You must write an init script that creates the database, user, and sets passwords from environment variables.",
      tags:["MariaDB","mysqld","init script","ENV secrets"],
      goal:"Build MariaDB from Debian, initialize the data directory, create the DB and user from env vars, and start the server correctly as PID 1.",
      template:`FROM debian:bullseye
RUN apt-get update && apt-get install -y mariadb-server \\
    && rm -rf /var/lib/apt/lists/*
COPY init.sh /init.sh
RUN chmod +x /init.sh
EXPOSE ___
ENTRYPOINT ["/init.sh"]`,
      hint:"Your init.sh should: 1) run <code>mysql_install_db</code> if the data dir is empty, 2) start mysqld temporarily, 3) run SQL to create the DB/user from <code>$MYSQL_*</code> env vars, 4) stop mysqld, 5) <code>exec mysqld_safe</code>. Never hardcode passwords — read them from env vars or Docker secrets.",
      solution:`# init.sh:
#!/bin/sh
if [ ! -d "/var/lib/mysql/$MYSQL_DATABASE" ]; then
  mysql_install_db --user=mysql --datadir=/var/lib/mysql
  mysqld_safe --skip-networking &
  sleep 3
  mysql -e "CREATE DATABASE IF NOT EXISTS $MYSQL_DATABASE;"
  mysql -e "CREATE USER '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD';"
  mysql -e "GRANT ALL ON $MYSQL_DATABASE.* TO '$MYSQL_USER'@'%';"
  mysql -e "FLUSH PRIVILEGES;"
  mysqladmin -u root shutdown
fi
exec mysqld_safe

# Dockerfile:
FROM debian:bullseye
RUN apt-get update && apt-get install -y mariadb-server \\
    && rm -rf /var/lib/apt/lists/*
COPY init.sh /init.sh
RUN chmod +x /init.sh
EXPOSE 3306
ENTRYPOINT ["/init.sh"]`,
      cmds:`docker build -t mariadb .
docker run -e MYSQL_DATABASE=wpdb \\
  -e MYSQL_USER=wpuser \\
  -e MYSQL_PASSWORD=secret mariadb`
    },
    {
      title:"Inception — WordPress + php-fpm",
      desc:"Build the WordPress container: install php-fpm and WordPress, configure wp-config.php from env vars, and run php-fpm as PID 1 without nginx.",
      tags:["php-fpm","wp-cli","wordpress","php-fpm.conf","9000"],
      goal:"Install php-fpm and WordPress, auto-configure wp-config.php using WP-CLI and env vars, expose port 9000, and start php-fpm correctly.",
      template:`FROM debian:bullseye
RUN apt-get update && apt-get install -y \\
    php-fpm php-mysql curl wget \\
    && rm -rf /var/lib/apt/lists/*
RUN curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \\
    && chmod +x wp-cli.phar && mv wp-cli.phar /usr/local/bin/wp
COPY setup.sh /setup.sh
RUN chmod +x /setup.sh
EXPOSE ___
ENTRYPOINT ["/setup.sh"]`,
      hint:"php-fpm's config must set <code>listen = 9000</code> (not a socket) so NGINX can reach it over the Docker network. In setup.sh, use <code>wp core install</code> to configure WordPress, then <code>exec php-fpmX.X -F</code>. The <code>-F</code> flag keeps php-fpm in the foreground as PID 1.",
      solution:`# setup.sh:
#!/bin/sh
if [ ! -f /var/www/html/wp-config.php ]; then
  wp core download --path=/var/www/html --allow-root
  wp config create --allow-root \\
    --dbname=$MYSQL_DATABASE --dbuser=$MYSQL_USER \\
    --dbpass=$MYSQL_PASSWORD --dbhost=mariadb
  wp core install --allow-root \\
    --url=https://$DOMAIN_NAME \\
    --title="My Site" \\
    --admin_user=$WP_ADMIN \\
    --admin_password=$WP_ADMIN_PASS \\
    --admin_email=$WP_ADMIN_EMAIL
fi
exec php-fpm7.4 -F

# Dockerfile:
FROM debian:bullseye
RUN apt-get update && apt-get install -y \\
    php7.4-fpm php7.4-mysql wget curl \\
    && rm -rf /var/lib/apt/lists/*
RUN curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \\
    && chmod +x wp-cli.phar && mv wp-cli.phar /usr/local/bin/wp
COPY setup.sh /setup.sh
RUN chmod +x /setup.sh
EXPOSE 9000
ENTRYPOINT ["/setup.sh"]`,
      cmds:`# php-fpm pool config (/etc/php/7.4/fpm/pool.d/www.conf):
# listen = 9000   (not 127.0.0.1:9000!)
docker build -t wordpress .`
    }
  ]
];

let currentLevel = 0;
let currentEx = 0;
let hintOpen = false;
let solOpen = false;

function switchLevel(lvl) {
  currentLevel = lvl;
  currentEx = 0;
  hintOpen = false;
  solOpen = false;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===lvl));
  renderList();
  renderPanel();
}

function selectEx(i) {
  currentEx = i;
  hintOpen = false;
  solOpen = false;
  renderList();
  renderPanel();
}

function toggleHint() {
  hintOpen = !hintOpen;
  document.getElementById('hcontent').classList.toggle('hidden', !hintOpen);
  document.getElementById('hbtn').innerHTML = `<i class="ti ${hintOpen?'ti-chevron-up':'ti-lightbulb'}" aria-hidden="true"></i> ${hintOpen?'Hide hint':'Show hint'}`;
}

function toggleSol() {
  solOpen = !solOpen;
  document.getElementById('scontent').classList.toggle('hidden', !solOpen);
  document.getElementById('sbtn').innerHTML = `<i class="ti ${solOpen?'ti-chevron-up':'ti-code'}" aria-hidden="true"></i> ${solOpen?'Hide solution':'Reveal solution'}`;
}

function renderList() {
  const list = document.getElementById('exlist');
  const exs = exercises[currentLevel];
  const offset = [0,6,11][currentLevel];
  list.innerHTML = exs.map((e,i) => `
    <div class="exitem ${i===currentEx?'sel':''}" onclick="selectEx(${i})">
      <div class="num">Exercise ${offset+i+1}</div>
      <div class="ti">${e.title}</div>
    </div>
  `).join('');
}

function renderPanel() {
  const e = exercises[currentLevel][currentEx];
  const lvlLabels = ['Beginner','Intermediate','Advanced'];
  const badges = ['badge-b','badge-i','badge-a'];
  const offset = [0,6,11][currentLevel];
  document.getElementById('panel').innerHTML = `
    <div>
      <div class="plevel"><span class="${badges[currentLevel]}">${lvlLabels[currentLevel]}</span> &nbsp;Exercise ${offset+currentEx+1}</div>
      <div class="ptitle">${e.title}</div>
      <div class="pdesc">${e.desc}</div>
      <div class="tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="goal">${e.goal}</div>

      <div class="slabel">Template</div>
      <pre>${e.template}</pre>

      <button class="tbtn" id="hbtn" onclick="toggleHint()">
        <i class="ti ti-lightbulb" aria-hidden="true"></i> Show hint
      </button>
      <div id="hcontent" class="hidden">
        <div class="hbox">${e.hint}</div>
      </div>

      <button class="tbtn" id="sbtn" onclick="toggleSol()">
        <i class="ti ti-code" aria-hidden="true"></i> Reveal solution
      </button>
      <div id="scontent" class="hidden">
        <div class="sbox">
          <pre>${e.solution}</pre>
          ${e.cmds ? `<div class="slabel">Commands to test</div><pre class="cmds">${e.cmds}</pre>` : ''}
        </div>
      </div>
    </div>
  `;
}

renderList();
renderPanel();
</script>
