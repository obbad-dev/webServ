server
{
    listen 127.0.0.1:8080;
    error_page  400 402 403 /errors/50x.html;
    root resources/sites;
    client_max_body_size 3k ;
    error_page  500 /errors/50x.html;
    index test.html;
    index test2.html;
    index test4.html test5.html;

    location / {
        allow_methods GET POST DELETE;
        root resources/sites ;
        index test4.html test5.html;
        index test.html;
        index test2.html;
        autoindex on;
    }
}
